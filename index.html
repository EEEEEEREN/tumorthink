<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>肿瘤图像智能分析助手</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #f6f8fb;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    /* ===== 顶部品牌栏 ===== */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(90deg, #0f4c81, #1a73e8);
      color: #fff;
    }
    .brand .left { display: flex; align-items: center; gap: 10px; }
    .brand .logo {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.2);
      border-radius: 9px;
      font-size: 20px;
    }
    .brand .t1 { font-size: 17px; font-weight: 700; }
    .brand .t2 { font-size: 12px; opacity: .85; margin-top: 2px; }
    .brand .pdf-btn {
      background: rgba(255,255,255,.92);
      color: #0f4c81;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap;
    }
    .brand .pdf-btn:hover { background: #fff; transform: translateY(-1px); }
    /* ===== 对话容器 ===== */
    #wsdk-container {
      position: relative;
      height: calc(100% - 90px);
    }
    /* ===== 底部提示 ===== */
    .foot {
      padding: 8px 16px;
      font-size: 12px;
      color: #8a97a8;
      text-align: center;
      background: #fff;
      border-top: 1px solid #eef2f7;
    }
    /* ===== 打印（导出 PDF）：隐藏下载按钮，打印整个对话页面 ===== */
    @media print {
      .brand .pdf-btn { display: none !important; }
      body { background: #fff !important; }
      .foot { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- 顶部品牌栏 -->
  <div class="brand">
    <div class="left">
      <div class="logo">🫁</div>
      <div>
        <div class="t1">肿瘤图像智能分析助手</div>
        <div class="t2">AI 辅助图像分析 · 仅供健康参考，不能替代医生确诊</div>
      </div>
    </div>
    <button class="pdf-btn" onclick="exportPDF()">📄 导出 PDF 报告</button>
  </div>

  <div id="wsdk-container"></div>

  <div class="foot">
    ⚠️ 本工具由 AI 进行图像特征辅助分析，不能作为肿瘤/癌症的诊断依据，请务必携带资料至正规医院（皮肤科/影像科/病理科）面诊确诊。
  </div>

  <!-- ============================================================
       扣子编程 Web SDK（AI 编程）接入
       官方文档：https://docs.coze.cn/developer_guides_vibe_coding_websdk
       ============================================================ -->
  <script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
  <script>
    // 【项目 ID】已填好，一般无需改
    var PROJECT_ID = "7701174471398326312";

    // 【已内置令牌】打开即用，无需任何人填写。给信任的人使用；建议定期更换。
    var YOUR_TOKEN = "sat_rFs7ntdplKddOq8bv7ZfAM9fxkbuYrxQf0ZoF7yGgCNknf4Qj21CZMm1FYtriVHC";

    // ===== 导出 PDF：直接走浏览器打印 → 目标/另存为 PDF =====
    function exportPDF() {
      window.print();
    }

    // ===== 初始化 Web SDK =====
    cozeWebSDK.init({
      projectId: PROJECT_ID,
      // 首次加载 Web SDK 时用 Token 完成身份验证
      refreshToken: function () {
        return Promise.resolve(YOUR_TOKEN);
      }
      // 可选：主题色
      // primaryColor: "#1a73e8"
    });
  </script>

</body>
</html>
