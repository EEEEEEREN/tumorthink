<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肿瘤图像智能分析助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg,#eef4ff 0%,#e8f3f7 100%);
    min-height: 100vh; color: #1e293b;
  }
  .top {
    background: linear-gradient(90deg,#0f4c81,#1a73e8);
    color:#fff; padding:16px 20px;
  }
  .top h1{ font-size:20px; }
  .top p{ font-size:12px; opacity:.85; margin-top:4px; }
  .wrap{ max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  .card{
    background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(15,76,129,.08);
    padding:20px; margin-bottom:16px;
  }
  .card h2{ font-size:15px; margin-bottom:12px; color:#0f4c81; }
  .uploader{
    border:2px dashed #b8cbe0; border-radius:12px; padding:26px; text-align:center;
    cursor:pointer; transition:.2s; background:#fafcff;
  }
  .uploader:hover,.uploader.drag{ border-color:#1a73e8; background:#f0f6ff; }
  .uploader .big{ font-size:32px; }
  .uploader .txt{ color:#5a6b7f; margin-top:6px; font-size:14px; }
  .uploader .hint{ color:#9aa9ba; font-size:12px; margin-top:4px; }
  #preview{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .p-item{ position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; background:#eef2f7; }
  .p-item img{ width:100%; height:100%; object-fit:cover; }
  .p-item .pdf{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#c0392b; font-size:12px;
  }
  .p-item .del{
    position:absolute; top:2px; right:2px; width:20px; height:20px; line-height:18px;
    text-align:center; background:rgba(0,0,0,.55); color:#fff; border-radius:50%;
    font-size:12px; cursor:pointer;
  }
  textarea{
    width:100%; min-height:60px; border:1px solid #d8e0ea; border-radius:10px;
    padding:10px; font-size:14px; resize:vertical; font-family:inherit; margin-top:10px;
  }
  .note{ font-size:12px; color:#a06a2a; background:#fff5e6; border-radius:8px; padding:10px; margin-top:12px; line-height:1.6; }
  .row{ display:flex; gap:10px; margin-top:14px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:600;
    cursor:pointer; color:#fff; background:#1a73e8; transition:.2s;
  }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .btn.green{ background:#188038; }
  .btn.gray{ background:#e8edf3; color:#1e293b; }
  #result{ display:none; }
  #resultContent{ line-height:1.75; font-size:14.5px; }
  #resultContent h3{
    font-size:15px; color:#0f4c81; margin:14px 0 6px; border-left:4px solid #1a73e8; padding-left:8px;
  }
  #resultContent p,#resultContent li{ font-size:14px; color:#33475b; margin:4px 0; }
  #loading{ display:none; text-align:center; color:#1a73e8; padding:20px; }
  #spinner{ width:26px; height:26px; border:3px solid #dbe4ef; border-top-color:#1a73e8; border-radius:50%; margin:0 auto 8px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .err{ color:#d93025; font-size:14px; }
</style>
</head>
<body>

<div class="top">
  <h1>🫁 肿瘤图像智能分析助手</h1>
  <p>上传 jpg / png / pdf → AI 思维链(COT)分析 → 一键下载 PDF 报告</p>
  <p style="opacity:.9;margin-top:6px">⚙️ 当前大模型：<b>豆包 Seed Lite 2.0</b>（轻量快速版）　·　<span style="opacity:.8">v3.2 自动收尾修复版</span></p>
</div>

<div class="wrap">

  <div class="card">
    <h2>📤 上传图片 / PDF</h2>
    <div class="uploader" id="uploader" onclick="document.getElementById('fileInput').click()">
      <div class="big">＋</div>
      <div class="txt">点击或拖拽选择文件</div>
      <div class="hint">支持 .jpg / .png / .pdf，可多选</div>
      <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" multiple style="display:none" onchange="handleFiles(this.files)" />
    </div>
    <div id="preview"></div>

    <textarea id="question" placeholder="补充说明（可选）：如症状部位、出现时间、有关检查结果等"></textarea>

    <div class="note">⚠️ 本工具由 AI 进行图像特征辅助分析，<b>不能作为肿瘤/癌症的诊断依据</b>，请务必携带资料至正规医院（皮肤科 / 影像科 / 病理科）面诊确诊。</div>

    <div class="row">
      <button class="btn" id="analyzeBtn" onclick="analyze()">开始分析</button>
    </div>
  </div>

  <div class="card" id="loading">
    <div id="spinner"></div>
    <div style="font-size:14px;color:#1e293b">AI 正在分步分析（思维链推理）…</div>
    <div id="currentStep" style="margin-top:14px;text-align:center;font-size:14px;font-weight:600;color:#166534;background:#e9f7ee;border:1px solid #cdeed6;border-radius:10px;padding:12px 16px"></div>
    <div id="streamPreview" style="margin-top:12px;text-align:left;font-size:13px;color:#5a6b7f;white-space:pre-wrap;max-height:200px;overflow:auto;border-top:1px dashed #d8e0ea;padding-top:10px"></div>
  </div>

  <div class="card" id="result">
    <h2>📋 分析结果</h2>
    <div id="resultContent"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn green" onclick="downloadPDF()">⬇ 下载 PDF 报告</button>
      <button class="btn gray" onclick="location.reload()">重新分析</button>
    </div>
  </div>

  <p style="font-size:12px;color:#8a97a8;margin-top:6px">* 分析结果与报告仅作健康参考，请在医生指导下使用。</p>
</div>

<script>
  // 同源调用 Vercel 的 Serverless 代理，无跨域
  var BASE = "/api";

  var uploads = [];   // {dataUrl, name, isPdf}
  var lastReport = "";

  document.getElementById('uploader').addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('drag'); });
  document.getElementById('uploader').addEventListener('dragleave', function(){ this.classList.remove('drag'); });
  document.getElementById('uploader').addEventListener('drop', function(e){
    e.preventDefault(); this.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    Array.prototype.forEach.call(files, function(f){
      if (!f.type.match(/image\/(jpeg|png|jpg)|pdf/)) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var isPdf = (f.type === 'application/pdf') || /\.pdf$/i.test(f.name);
        uploads.push({ dataUrl: ev.target.result, name: f.name, isPdf: isPdf });
        renderPreview();
      };
      reader.readAsDataURL(f);
    });
  }

  function renderPreview() {
    var p = document.getElementById('preview');
    p.innerHTML = '';
    uploads.forEach(function(u, i){
      var d = document.createElement('div'); d.className = 'p-item';
      if (u.isPdf) {
        d.innerHTML = '<div class="pdf">📄<br/><span style="font-size:10px">PDF</span></div>';
      } else {
        var img = document.createElement('img'); img.src = u.dataUrl; d.appendChild(img);
      }
      var del = document.createElement('span'); del.className='del'; del.textContent='×';
      del.onclick = function(){ uploads.splice(i,1); renderPreview(); };
      d.appendChild(del);
      p.appendChild(d);
    });
  }

  function esc(s){ var div=document.createElement('div'); div.textContent=s; return div.innerHTML; }

  function renderMarkdown(txt) {
    var box = document.getElementById('resultContent');
    txt.split('\n').forEach(function(line){
      var m = line.trim();
      if (!m) { box.appendChild(document.createElement('br')); return; }
      if (m.charAt(0)==='#') {
        var h=document.createElement('h3'); h.textContent=m.replace(/^#+\s*/,''); box.appendChild(h);
      } else if (/^[-*•]\s/.test(m)) {
        var li=document.createElement('li'); li.textContent=m.replace(/^[-*•]\s*/,''); box.appendChild(li);
      } else {
        var p=document.createElement('p'); p.textContent=m; box.appendChild(p);
      }
    });
  }

  function analyze() {
    if (!uploads.length && !document.getElementById('question').value.trim()) {
      alert('请至少上传一张图片/PDF，或填写说明'); return;
    }
    var q = document.getElementById('question').value.trim() || '请对上传的图片进行 COT 多步分析。';
    var content = [{ type:'text', text:q }];
    uploads.forEach(function(u){ content.push({ type:'image_url', image_url:{ url:u.dataUrl } }); });

    document.getElementById('loading').style.display='block';
    document.getElementById('result').style.display='none';
    document.getElementById('analyzeBtn').disabled = true;
    var spEl = document.getElementById('streamPreview');
    spEl.textContent = '';

    // 思维链步骤（细分，只高亮显示当前一步，并说明具体在干嘛）
    var steps = [
      { title:'步骤1 · 图像整体观察',   doing:'正在读取并识别图像，分析图片类型、整体构图与可见结构…' },
      { title:'步骤2 · 病灶定位与轮廓', doing:'正在定位可疑病灶，评估其方位、大小比例、形状与边界…' },
      { title:'步骤3 · 形态特征分析',   doing:'正在分析颜色/灰度分布、边界规则度与形态对称性（参考ABCD）…' },
      { title:'步骤4 · 纹理与内部结构', doing:'正在观察表面纹理、破溃、出血、结痂与内部结构特征…' },
      { title:'步骤5 · 综合风险分级',   doing:'正在基于可见特征综合判断可疑度，给出低/中/高分级…' },
      { title:'步骤6 · 建议与就医指引', doing:'正在归纳主要发现，整理检查方式与分科就医建议…' }
    ];
    var stepIdx = -1;  // 当前已推进到的步骤下标
    var streamBuf = '';
    var curStepEl = document.getElementById('currentStep');
    curStepEl.style.display = 'block';
    curStepEl.innerHTML = '⏳ 正在准备分析…';

    // ==== 自动收尾机制（分析内容一旦完整，立即收尾并显示下载按钮）====
    // 不再依赖"等定时器/等流结束"——那样会因为 Vercel SSE 连接挂着不结束而卡住。
    // 改为：每次收到数据都同步检测内容是否已完整（命中报告固定结尾），一旦完整立即收尾。
    // 额外保留空闲超时(12s)与总超时(2.5min)作为兜底，防止结尾标志未命中。
    var IDLE_MS = 12000;      // 普通阶段空闲超时（兜底，不靠它主动收尾）
    var TOTAL_MS = 150000;    // 最多等待 2.5 分钟，强制收尾兜底
    // 报告的固定结尾（COT 提示词强制），命中即认为内容输出完整，立即收尾
    var COMPLETE_MARKS = ['请务必线下就医确诊','AI 辅助分析，仅供参考','仅供参考，请务必','就医确诊'];
    var readerRef = null;     // 保存 reader，用于主动取消连接
    var idleTimer = null, totalTimer = null;
    var finalized = false;
    var normalDone = false;    // 是否已正常完成（用于阻止 catch 覆盖报告）
    var watchdog = null;       // 独立兜底监视器

    function cancelReader(){
      try { if (readerRef && readerRef.cancel){ readerRef.cancel(); } } catch(e){}
      readerRef = null;
    }
    function doFinalize(){
      if (finalized) return; finalized = true; normalDone = true;
      if (idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
      if (totalTimer){ clearTimeout(totalTimer); totalTimer=null; }
      if (watchdog){ clearInterval(watchdog); watchdog=null; }
      cancelReader();
      finalize();
    }
    function isComplete(){
      if (streamBuf.length===0) return false;
      for (var i=0;i<COMPLETE_MARKS.length;i++){
        if (streamBuf.indexOf(COMPLETE_MARKS[i])>=0) return true;
      }
      return false;
    }
    function checkComplete(){
      // 关键：同步检测内容是否已完整，一完整立即收尾，绝不拖延
      if (!finalized && isComplete()){ doFinalize(); }
    }
    function armIdle(){
      checkComplete();                       // 先同步收尾（当内容已完整）
      if (finalized) return;
      if (idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
      idleTimer = setTimeout(function(){
        if (finalized) return;
        if (streamBuf.length===0) return;    // 尚无内容，继续等待
        doFinalize();                        // 空闲兜底
      }, IDLE_MS);
    }
    totalTimer = setTimeout(doFinalize, TOTAL_MS);
    // 终极兜底：每秒检查一次内容完整性，独立于 SSE 读取循环。
    // 即使 Vercel 连接挂着 / reader.read() 不返回，只要内容已完整(含结尾标志)就立即收尾。
    watchdog = setInterval(function(){
      checkComplete();
    }, 1000);

    // 只显示当前进行到的一步，说明"具体在干嘛"
    function showCurrentStep(){
      var cur = (stepIdx>=0 && stepIdx<steps.length) ? steps[stepIdx] : steps[0];
      curStepEl.innerHTML = '⏳ 当前进行：<b>' + cur.title + '</b><div style="font-weight:400;font-size:12.5px;color:#556a62;margin-top:5px">' + cur.doing + '</div>';
    }
    showCurrentStep();

    // 核心：流式读取 SSE 并实时渲染
    fetch(BASE + '/stream_run', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ messages:[{ role:'user', content:content }], stream:true })
    }).then(function(resp){
      if (!resp.ok) return resp.text().then(function(t){ throw new Error('请求失败: '+resp.status+' '+t.slice(0,120)); });
      var reader = resp.body.getReader();
      readerRef = reader;
      var decoder = new TextDecoder();
      var buffer = '';
      function pump(){
        return reader.read().then(function(r){
          if (r.done) { doFinalize(); return; }
          buffer += decoder.decode(r.value, { stream:true });
          // 解析 SSE: 按空行切分事件块
          var parts = buffer.split('\n\n');
          buffer = parts.pop();
          parts.forEach(function(block){
            var dataLine='';
            block.split('\n').forEach(function(l){
              if (l.indexOf('data: ')==0) dataLine = l.slice(6);
            });
            if (!dataLine) return;
            var ev;
            try { ev = JSON.parse(dataLine); } catch(e){ return; }
            if (ev.type === 'answer' && ev.content && ev.content.answer){
              streamBuf += ev.content.answer;
              spEl.textContent = streamBuf.slice(-1600);
              armIdle();
              // 识别到的大标题推进当前步骤（6步与 titles 一一对应）
              var titles = ['图像整体观察','病灶','形态','纹理','风险分级','就医'];
              titles.forEach(function(t){
                if (streamBuf.indexOf('# '+t)>=0 && stepIdx < titles.length){
                  var idx = titles.indexOf(t);
                  if (idx >= 0 && idx > stepIdx){ stepIdx = idx; showCurrentStep(); }
                }
              });
              // 命中"建议与就医"等同最后一步
              if (stepIdx < 5 && (streamBuf.indexOf('建议与就医')>=0 || streamBuf.indexOf('# 建议')>=0)){
                stepIdx = 5; showCurrentStep();
              }
            }
          });
          return pump();
        });
      }
      function finalize(){
        if (idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
        if (totalTimer){ clearTimeout(totalTimer); totalTimer=null; }
        lastReport = streamBuf.trim();
        document.getElementById('loading').style.display='none';
        document.getElementById('analyzeBtn').disabled = false;
        document.getElementById('result').style.display='block';
        curStepEl.innerHTML = '✅ 分析完成：<b>生成分析报告</b>';
        if (!lastReport) {
          document.getElementById('resultContent').innerHTML = '<p class="err">❌ 未获取到分析结果，请稍后重试或检查资源点是否充足。</p>';
        } else {
          renderMarkdown(lastReport);
        }
      }
      return pump();
    }).catch(function(err){
      if (normalDone) return;        // 已正常完成，忽略 cancel 引发的后续报错，保留报告
      finalized = true;
      if (idleTimer){ clearTimeout(idleTimer); idleTimer=null; }
      if (totalTimer){ clearTimeout(totalTimer); totalTimer=null; }
      document.getElementById('loading').style.display='none';
      document.getElementById('analyzeBtn').disabled = false;
      document.getElementById('result').style.display='block';
      document.getElementById('resultContent').innerHTML = '<p class="err">❌ '+esc(err.message)+'</p>';
    });
  }

  function downloadPDF() {
    if (!lastReport) { alert('请先完成分析'); return; }
    fetch(BASE + '/export_report', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ report: lastReport })
    }).then(function(r){
      if (r.status===401) throw new Error('鉴权失败(401)');
      return r.blob();
    }).then(function(blob){
      var a=document.createElement('a');
      var url=URL.createObjectURL(blob);
      a.href=url; a.download='肿瘤图像分析报告.pdf';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
    }).catch(function(err){ alert('下载失败：'+err.message); });
  }
</script>
</body>
</html>
